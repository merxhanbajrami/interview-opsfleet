[project]
name = "insight-agent"
version = "0.1.0"
description = "Conversational data-analysis agent for retail executives, over BigQuery."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Orchestration: stateful DAG with durable checkpoints and native interrupt/resume.
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.30",
    "langchain-google-genai>=2.0.8",
    # Data plane
    "google-cloud-bigquery>=3.27.0",
    "google-cloud-bigquery-storage>=2.27.0",
    "db-dtypes>=1.3.0",
    "pandas>=2.2.0",
    # SQL parsing / rewriting: the enforcement point for PII and row scope.
    "sqlglot>=26.0.0",
    # Golden Bucket vector search, in-process. No separate vector DB in the prototype.
    "sqlite-vec>=0.1.9",
    # Config, CLI, resilience
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "langchain-anthropic>=1.7.2",
]

[project.scripts]
insight = "insight_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
